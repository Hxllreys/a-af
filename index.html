<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İyi ki Doğdun! 🎂</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <div class="music-container">
        <!-- Spotify Albüm / Playlist Kapak Görseli Temsili -->
        <svg class="playlist-header-img" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
            <rect width="500" height="500" fill="#000000"/>
            <rect x="150" y="150" width="200" height="200" rx="45" fill="#f43f5e"/>
            <path d="M 230 205 L 305 205 C 325 205, 335 215, 335 230 C 335 242, 325 250, 310 250 L 310 250" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
            <polygon points="238,190 238,220 215,205" fill="#ffffff"/>
            <path d="M 270 295 L 195 295 C 175 295, 165 285, 165 270 C 165 258, 175 250, 190 250 L 190 250" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
            <polygon points="262,310 262,280 285,295" fill="#ffffff"/>
        </svg>

        <div class="playlist-name">Doğum Günün Kutlu Olsun! 🎉</div>
        <div class="playlist-sub">Sana Özel Hazırladığım Şarkılar 🎵</div>
        
        <!-- Dönen Plak Efekti -->
        <div class="vinyl-container">
            <div class="record"></div>
            <svg class="record-center" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                <rect width="500" height="500" fill="#000000"/>
                <rect x="150" y="150" width="200" height="200" rx="45" fill="#f43f5e"/>
            </svg>
        </div>

        <p class="music-desc">Keyifle dinlemen ve mutlu yaşlar geçirmen dileğiyle...</p>
        
        <!-- Spotify Çalma Listesi Linkin Ekrandı -->
        <a href="https://open.spotify.com/playlist/552BL05HIcPV6p3OWtjt2W?si=R71BY3S-QamVvEM8JSp-cQ&utm_source=copy-link&pt=14c52dc9c4f54076abe5db5a3f6cb069" target="_blank" class="spotify-link">Spotify'da Dinle 🎧</a>
    </div>
</div>

</body>
</html>
